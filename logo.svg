<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 330" width="280" height="330">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f2dc"/>
      <stop offset="100%" style="stop-color:#f0f7e6"/>
    </linearGradient>
    <linearGradient id="animalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a1b"/>
      <stop offset="100%" style="stop-color:#4a7a2d"/>
    </linearGradient>
  </defs>

  <!-- === PHONE / SHIELD FRAME === -->
  <rect x="18" y="6" width="244" height="272" rx="38" fill="url(#frameGrad)" stroke="#2d5a1b" stroke-width="9"/>
  <!-- Camera notch -->
  <rect x="100" y="20" width="80" height="13" rx="6" fill="#2d5a1b"/>

  <!-- === MEDICAL CROSS (top-right) === -->
  <rect x="212" y="48" width="9" height="36" rx="4" fill="#2d5a1b"/>
  <rect x="199" y="60" width="36" height="9" rx="4" fill="#2d5a1b"/>

  <!-- === COW silhouette (left) === -->
  <!-- Body -->
  <ellipse cx="95" cy="158" rx="55" ry="38" fill="#2d5a1b"/>
  <!-- Head -->
  <circle cx="143" cy="138" r="28" fill="#2d5a1b"/>
  <!-- Horn left -->
  <path d="M 130,116 Q 122,98 130,90" fill="none" stroke="#2d5a1b" stroke-width="7" stroke-linecap="round"/>
  <!-- Horn right -->
  <path d="M 152,114 Q 162,98 156,88" fill="none" stroke="#2d5a1b" stroke-width="7" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="118" cy="126" rx="9" ry="6" transform="rotate(-20 118 126)" fill="#2d5a1b"/>
  <ellipse cx="165" cy="122" rx="9" ry="6" transform="rotate(15 165 122)" fill="#2d5a1b"/>
  <!-- Eye -->
  <circle cx="138" cy="136" r="4" fill="#e8f2dc"/>
  <!-- Spot -->
  <ellipse cx="80" cy="148" rx="16" ry="11" fill="#4a7a2d" opacity="0.45"/>
  <!-- Legs -->
  <rect x="48" y="190" width="13" height="42" rx="5" fill="#2d5a1b"/>
  <rect x="66" y="190" width="13" height="42" rx="5" fill="#2d5a1b"/>
  <rect x="108" y="190" width="13" height="42" rx="5" fill="#2d5a1b"/>
  <rect x="126" y="190" width="13" height="42" rx="5" fill="#2d5a1b"/>
  <!-- Tail -->
  <path d="M 40,162 Q 26,150 30,134 Q 34,120 42,130" fill="none" stroke="#2d5a1b" stroke-width="7" stroke-linecap="round"/>

  <!-- === HORSE silhouette (right) === -->
  <!-- Body -->
  <ellipse cx="210" cy="162" rx="42" ry="32" fill="#4a7a2d"/>
  <!-- Neck -->
  <path d="M 222,133 L 232,96 L 248,102 L 236,136" fill="#4a7a2d"/>
  <!-- Head -->
  <path d="M 230,84 Q 248,74 258,86 Q 262,98 250,108 Q 238,114 228,106 Q 222,96 230,84Z" fill="#4a7a2d"/>
  <!-- Nostril -->
  <ellipse cx="254" cy="102" rx="3.5" ry="2.5" fill="#2d5a1b"/>
  <!-- Eye -->
  <circle cx="242" cy="90" r="3" fill="#e8f2dc"/>
  <!-- Mane -->
  <path d="M 234,88 Q 226,80 222,88 Q 219,96 226,100" fill="none" stroke="#2d5a1b" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="175" y="188" width="13" height="44" rx="5" fill="#4a7a2d"/>
  <rect x="193" y="188" width="13" height="44" rx="5" fill="#4a7a2d"/>
  <rect x="217" y="188" width="13" height="44" rx="5" fill="#4a7a2d"/>
  <rect x="234" y="188" width="13" height="44" rx="5" fill="#4a7a2d"/>
  <!-- Tail -->
  <path d="M 252,166 Q 268,158 264,144 Q 260,132 252,140" fill="none" stroke="#4a7a2d" stroke-width="7" stroke-linecap="round"/>

  <!-- === SWOOSH ARC === -->
  <path d="M 36,242 Q 140,285 244,242" fill="none" stroke="#4a7a2d" stroke-width="11" stroke-linecap="round"/>

  <!-- === WORDMARK === -->
  <text x="140" y="303" text-anchor="middle"
        font-family="Arial Black,Arial,Helvetica,sans-serif"
        font-size="42" font-weight="900" fill="#2d5a1b">Vet<tspan fill="#4a7a2d">Pr&#225;tica</tspan></text>
  <text x="140" y="324" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="13" fill="#6b9e40" letter-spacing="0.5">Assistente da rotina veterin&#225;ria</text>
</svg>
